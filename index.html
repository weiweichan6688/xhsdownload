<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小红书无水印视频下载</title>
<style>
  :root {
    --bg1: #ff5e62;
    --bg2: #ff9966;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #888;
    --line: #eee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
    padding: 32px 28px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  textarea, input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    transition: border-color .15s;
  }
  textarea:focus, input:focus { border-color: var(--bg1); }
  textarea { min-height: 84px; }
  input { min-height: auto; }
  .row { display: flex; gap: 10px; align-items: center; }
  .btn {
    margin-top: 18px;
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 10px; display: none; }
  .msg.err { display: block; background: #fff0f0; color: #c0392b; }
  .msg.ok { display: block; background: #f0fff4; color: #1e7d40; }
  .result { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 18px; display: none; }
  .result.show { display: block; }
  .result video { width: 100%; border-radius: 12px; background: #000; }
  .meta { font-size: 13px; color: var(--muted); margin: 10px 0 14px; word-break: break-all; }
  .actions { display: flex; gap: 10px; }
  .actions a, .actions button {
    flex: 1;
    text-align: center;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    background: #fafafa;
  }
  .actions a.primary { background: linear-gradient(135deg, var(--bg1), var(--bg2)); color: #fff; border: none; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.6; }
  code { background: #f3f3f3; padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>小红书无水印视频下载</h1>
    <div class="sub">粘贴笔记链接（或分享文案），一键获取原始无水印视频直链</div>

    <label for="url">小红书链接 / 分享文案</label>
    <textarea id="url" placeholder="例如：https://www.xiaohongshu.com/explore/xxxx 或 xhslink.com 短链"></textarea>

    <label for="cookie">Cookie（可选）</label>
    <input id="cookie" placeholder="仅当链接需要登录可见时填写，留空即可" />

    <button class="btn" id="parseBtn">解析视频</button>

    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <video id="player" controls playsinline></video>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <a class="primary" id="dl" target="_blank" rel="noopener">下载视频</a>
        <button id="copy">复制链接</button>
      </div>
    </div>

    <div class="tip">
      提示：直接点「下载视频」会在新标签页打开原片，右键即可保存。<br />
      若提示需要登录，请打开小红书网页版按 F12 → Application → Cookies 复制
      <code>a1</code> 等字段填到上方 Cookie 框。
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  $('parseBtn').addEventListener('click', async () => {
    const url = $('url').value.trim();
    const cookie = $('cookie').value.trim();
    const btn = $('parseBtn');
    if (!url) { showMsg('请先粘贴小红书链接', false); return; }

    btn.disabled = true; btn.textContent = '解析中…'; msg.className = 'msg';
    try {
      const r = await fetch('/.netlify/functions/xhs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, cookie }),
      });
      const data = await r.json();
      if (!r.ok || data.error) throw new Error(data.error || '解析失败');

      $('player').src = data.videoUrl;
      $('meta').textContent = (data.author ? '作者：' + data.author + '  |  ' : '') + '标题：' + data.title;
      $('dl').href = data.videoUrl;
      $('copy').onclick = () => {
        navigator.clipboard.writeText(data.videoUrl).then(() => showMsg('直链已复制', true));
      };
      $('result').classList.add('show');
      if (data.watermarked) {
        showMsg('注意：该笔记未提供原始无水印片，已返回带水印的转码版', false);
      } else if (data.type === 'm3u8') {
        showMsg('已返回 m3u8 流地址，可用支持 m3u8 的下载器保存', true);
      } else {
        msg.className = 'msg';
      }
    } catch (e) {
      showMsg(e.message || '解析失败，请检查链接', false);
      $('result').classList.remove('show');
    } finally {
      btn.disabled = false; btn.textContent = '解析视频';
    }
  });
</script>
</body>
</html>
